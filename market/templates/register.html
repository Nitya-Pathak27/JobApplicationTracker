{% extends "base.html" %}
{% block title %}
    Register
{% endblock %}
    
{% block content %}
    <div class = "form-container">
        <h1 class = "form-heading">Create new account.</h1>
        <p class = "form-text">Organize your applications. Accelerate your career.</p>

        <form class = "form" method = "POST" action = "{{ url_for('register_page') }}">
            <!-- Text Input -->
            <div class = "form-group">
                <label for = "fullname" class = "form-label">Your full name</label><br>
                <input type = "text" id = "fullname" name = "fullname" class = "form-input" placeholder = "Full Name" required><br><br>
            </div>

            <!-- Email Input -->
            <div class = "form-group">
                <label for = "email" class = "form-label">Your email</label><br>
                <input type = "email" id = "email" name = "email" class = "form-input" placeholder = "E-mail"><br><br>
            </div>

            <!-- Password Input -->
            <div class = "form-group">
                <label for = "pwd" class = "form-label">Create Password</label><br>
                <input type = "password" id = "pwd" name = "password" class = "form-input" placeholder = "Password" required><br><br>
            </div>

            <!-- Repeate password Input -->
            <div class = "form-group">
                <label for = "re-pwd" class = "form-label">Repeat password</label><br>
                <input type = "password" id = "re-pwd" name = "confirm_password" class = "form-input" placeholder = "Repeat password" required><br><br>
            </div>

            <!-- Submit Button -->
            <div class = "form-group">
                <button type = "submit">Sign up</button>
            </div>
        </form>

        <p class = "form-text">
            Already have an account?
            <a href = "{{ url_for('login_page') }}" class = "form-link">Login here</a>
        </p>
    </div>
{% endblock %}
