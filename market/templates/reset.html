{% extends "base.html" %}
{% block title %}
    Reset Password
{% endblock %}

{% block content %}
    <div class = "form-container">
        <h1 class = "form-heading">Reset Password</h1>
        <p class = "form-text">Create a strong new password to securely regain access to your account.</p>

        <form class = "form" method = "POST" action = "{{ url_for('reset_password', token=token) }}">
            <!-- New Password Input -->
            <div class = "form-group">
                <label for = "newpwd" class = "form-label">New Password</label><br>
                <input type = "password" id = "newpwd" name = "new_password" class = "form-input" placeholder = "New Password"><br><br>
            </div>

            <!-- Confirm Password Input -->
            <div class = "form-group">
                <label for = "confirm-pwd" class = "form-label">Confirm Password</label><br>
                <input type = "password" id = "confirm-pwd" name = "confirm_password" class = "form-input" placeholder = "Confirm Password"><br><br>
            </div>

            <div class = "form-group">
                <button type = "submit">Reset Password</button>
            </div>
        </form>
        <p class = "form-text">
            <a href = "{{ url_for('login_page') }}">BACK TO LOGIN</a>
        </p>
    </div>
{% endblock %}
