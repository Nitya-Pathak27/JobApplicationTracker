{% extends "base.html" %}
{% block title %}
    Edit Application
{% endblock %}

{% block content %}
    <div class = "edit-form-container">
        <h1 class = "form-heading">Edit Application</h1>

        <form method = "POST" class = "application-form" action = "{{ url_for('edit_application', application_id=application[0]) }}">

            <!-- company -->
            <div class = "form-group">
                <label>Company</label>
                <input type = "text" name = "company" class = "form-input" value = "{{ application[1] }}">
            </div>

            <!-- position -->
            <div class = "form-group">
                <label>Position</label>
                <input type = "text" name = "position"class = "form-input" value = "{{ application[2] }}">
            </div>

            <!-- Applied date -->
            <div class = "form-group">
                <label>Date</label>
                <input type = "date" name = "date" class = "form-input" value = "{{ application[3] }}">
            </div>

            <!-- Deadline -->
            <div class = "form-group">
                <label>Deadline</label>
                <input type = "date" name = "deadline" class = "form-input" value = "{{ application[4] }}">
            </div>

            <!-- Status -->
            <div class = "form-group">
                <label>Status</label>
                <select name = "status" class = "form-input">
                    <option value = "applied"
                        {% if application[5] == "applied" %}
                            selected
                        {% endif %}
                    >
                        Applied
                    </option>
                    <option value = "interview_scheduled"
                        {% if application[5] == "interview_scheduled" %}
                            selected
                        {% endif %}
                    >
                        Interview Scheduled
                    </option>
                    <option value = "selected"
                        {% if application[5] == "selected" %}
                            selected
                        {% endif %}
                    >
                        Selected
                    </option>
                    <option value = "rejected"
                        {% if application[5] == "rejected" %}
                            selected
                        {% endif %}
                    >
                        Rejected
                    </option>
                </select>
            </div>

            <!-- job link -->
            <div class = "form-group">
                <label>Job Link</label>
                <input type = "url" name = "job_link" class = "form-input" value = "{{ application[6] }}">
            </div>

            <!-- submit button -->
            <div class = "form-group">
                <button type = "submit" class = "form-btn">Update Application</button>
            </div>
        </form>
    </div>
{% endblock %}
